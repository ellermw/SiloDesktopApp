name: Automated review and guarded remediation

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
      expected_head_sha:
        description: Exact pull request head SHA expected by the dispatcher
        required: true
        type: string
      cycle:
        description: Completed automated remediation cycles
        required: true
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: silo-automated-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  context:
    name: Validate trusted PR context
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.base.ref == 'main' &&
       github.actor == 'ellermw') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.actor == 'ellermw' || github.actor == 'github-actions[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.guard.outputs.eligible }}
      can_remediate: ${{ steps.guard.outputs.can_remediate }}
      reason: ${{ steps.guard.outputs.reason }}
      pr_number: ${{ steps.guard.outputs.pr_number }}
      head_sha: ${{ steps.guard.outputs.head_sha }}
      base_sha: ${{ steps.guard.outputs.base_sha }}
      head_ref: ${{ steps.guard.outputs.head_ref }}
      cycle: ${{ steps.guard.outputs.cycle }}
      max_cycles: ${{ steps.guard.outputs.max_cycles }}
    steps:
      - name: Check out trusted workflow guard
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The one-time bootstrap branch has no guard on main yet and cannot
          # remediate itself. All operational runs load guard code from main.
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'automation/review-remediation-loop' && github.event.pull_request.head.sha) || github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Resolve dispatched pull request
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/pull-request.json"

      - name: Enforce repository, actor, branch, SHA, and cycle guards
        id: guard
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            node scripts/automation/guard-context.mjs \
              "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/pull-request.json"
          else
            node scripts/automation/guard-context.mjs "$GITHUB_EVENT_PATH"
          fi

      - name: Reject ineligible execution
        if: steps.guard.outputs.eligible != 'true'
        env:
          REASON: ${{ steps.guard.outputs.reason }}
        shell: bash
        run: |
          echo "Automation request rejected: $REASON" >&2
          exit 1

      - name: Check out exact pull request head for validation
        if: steps.guard.outputs.eligible == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.guard.outputs.head_sha }}
          persist-credentials: false
          clean: true

      - name: Run automation fixture tests
        if: steps.guard.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node tests/automation/automation.test.mjs
          node --check scripts/automation/guard-context.mjs
          node --check scripts/automation/parse-coderabbit.mjs
          node --check scripts/automation/validate-remediation.mjs
          node -e 'JSON.parse(require("fs").readFileSync(".github/codex/remediation-output.schema.json", "utf8"))'

  windows_validation:
    name: Windows x64 build and tests
    needs: context
    if: needs.context.outputs.eligible == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.context.outputs.head_sha }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false
          clean: true

      - name: Set up .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x

      - name: Verify exact checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.context.outputs.head_sha }}
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) {
            throw "Checked out SHA does not match the reviewed pull request head."
          }

      - name: Restore
        shell: pwsh
        run: dotnet restore SiloPlayer.sln -p:Platform=x64 -nologo

      - name: Build x64 Release
        shell: pwsh
        run: dotnet build SiloPlayer.sln -c Release -p:Platform=x64 --no-restore -nologo

      - name: Run complete test suite
        shell: pwsh
        run: dotnet test tests/SiloPlayer.Tests/SiloPlayer.Tests.csproj -c Release -nologo

  review:
    name: CodeRabbit review
    needs: context
    if: needs.context.outputs.eligible == 'true'
    runs-on: [self-hosted, linux, x64, app-review]
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      issue_count: ${{ steps.parse.outputs.issue_count }}
      critical_count: ${{ steps.parse.outputs.critical_count }}
      review_status: ${{ steps.parse.outputs.review_status }}
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.context.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify checkout and authentication
        env:
          EXPECTED_SHA: ${{ needs.context.outputs.head_sha }}
          HOME: /home/silo-review
          CODEX_HOME: /home/silo-review/.codex
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          coderabbit auth status --agent

      - name: Review exact pull request diff
        env:
          BASE_SHA: ${{ needs.context.outputs.base_sha }}
          HOME: /home/silo-review
          CODEX_HOME: /home/silo-review/.codex
        shell: bash
        run: |
          set -euo pipefail
          coderabbit review --agent --base-commit "$BASE_SHA" -c AGENTS.md \
            | tee "$RUNNER_TEMP/coderabbit-review.ndjson"

      - name: Parse structured review output
        id: parse
        env:
          PR_NUMBER: ${{ needs.context.outputs.pr_number }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
          BASE_SHA: ${{ needs.context.outputs.base_sha }}
          REMEDIATION_CYCLE: ${{ needs.context.outputs.cycle }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/automation/parse-coderabbit.mjs \
            "$RUNNER_TEMP/coderabbit-review.ndjson" \
            "$RUNNER_TEMP/review-report.json" \
            "$RUNNER_TEMP/review-summary.md"

      - name: Upload structured review
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coderabbit-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/review-report.json
            ${{ runner.temp }}/review-summary.md
          if-no-files-found: error
          retention-days: 7

  publish_review:
    name: Publish review summary
    needs: [context, review]
    if: always() && needs.context.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Download successful review
        if: needs.review.result == 'success'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: coderabbit-review-${{ github.run_id }}
          path: review

      - name: Prepare review comment
        env:
          REVIEW_RESULT: ${{ needs.review.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REVIEW_RESULT" == "success" ]]; then
            cp review/review-summary.md comment.md
          else
            {
              echo '<!-- silo-automated-review -->'
              echo '## Automated CodeRabbit review'
              echo
              echo "Review failed for \`$HEAD_SHA\`. No remediation was attempted."
            } > comment.md
          fi
          {
            echo
            echo "[Workflow run]($RUN_URL)"
          } >> comment.md

      - name: Create or update the single review comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.context.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t comment_ids < <(gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq '.[] | select(.body | contains("<!-- silo-automated-review -->")) | .id')
          comment_id="${comment_ids[0]:-}"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -F body=@comment.md > /dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F body=@comment.md > /dev/null
          fi

  remediate:
    name: Generate guarded Codex patch
    needs: [context, windows_validation, review]
    if: >-
      needs.context.outputs.eligible == 'true' &&
      needs.context.outputs.can_remediate == 'true' &&
      needs.windows_validation.result == 'success' &&
      needs.review.result == 'success' &&
      fromJSON(needs.review.outputs.issue_count) > 0 &&
      fromJSON(needs.review.outputs.critical_count) == 0
    runs-on: [self-hosted, linux, x64, app-review]
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      has_patch: ${{ steps.patch.outputs.has_patch }}
      fixed_count: ${{ steps.validate.outputs.fixed_count }}
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.context.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Reject a stale pull request head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.context.outputs.pr_number }}
          EXPECTED_SHA: ${{ needs.context.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          test "$current_sha" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Download structured review
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: coderabbit-review-${{ github.run_id }}
          path: .codex-automation

      - name: Run Codex remediation
        env:
          HOME: /home/silo-review
          CODEX_HOME: /home/silo-review/.codex
        shell: bash
        run: |
          set -euo pipefail
          codex login status
          codex exec --ephemeral --sandbox workspace-write --json \
            --output-schema .github/codex/remediation-output.schema.json \
            --output-last-message .codex-automation/remediation-result.json \
            -C "$GITHUB_WORKSPACE" \
            "$(< .github/codex/remediation-prompt.md)" \
            | tee .codex-automation/codex-events.jsonl

      - name: Validate finding dispositions
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/automation/validate-remediation.mjs \
            .codex-automation/review-report.json \
            .codex-automation/remediation-result.json

      - name: Create binary-safe patch
        id: patch
        env:
          HAS_FIX: ${{ steps.validate.outputs.has_fix }}
        shell: bash
        run: |
          set -euo pipefail
          git add -N -- . ':(exclude).codex-automation/**' ':(exclude).github/workflows/**'
          git diff --binary --full-index HEAD -- . ':(exclude).codex-automation/**' \
            ':(exclude).github/workflows/**' \
            > .codex-automation/remediation.patch
          if [[ "$HAS_FIX" == "true" ]]; then
            test -s .codex-automation/remediation.patch
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
          else
            test ! -s .codex-automation/remediation.patch
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload remediation evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: codex-remediation-${{ github.run_id }}
          path: |
            .codex-automation/remediation-result.json
            .codex-automation/codex-events.jsonl
            .codex-automation/remediation.patch
          if-no-files-found: error
          retention-days: 7

  push_patch:
    name: Apply patch and update PR branch
    needs: [context, remediate]
    if: needs.remediate.result == 'success' && needs.remediate.outputs.has_patch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - name: Check out exact reviewed head with push credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.context.outputs.head_sha }}
          fetch-depth: 0
          clean: true

      - name: Download generated patch
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: codex-remediation-${{ github.run_id }}
          path: remediation

      - name: Recheck SHA, apply, commit, and push
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.context.outputs.pr_number }}
          EXPECTED_SHA: ${{ needs.context.outputs.head_sha }}
          HEAD_REF: ${{ needs.context.outputs.head_ref }}
          CYCLE: ${{ needs.context.outputs.cycle }}
          MAX_CYCLES: ${{ needs.context.outputs.max_cycles }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          test "$current_sha" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

          git apply --check --index remediation/remediation.patch
          git apply --index remediation/remediation.patch
          test -n "$(git diff --cached --name-only)"

          next_cycle="$((CYCLE + 1))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Automated CodeRabbit remediation (cycle ${next_cycle}/${MAX_CYCLES})"
          git push origin "HEAD:refs/heads/${HEAD_REF}"
          new_sha="$(git rev-parse HEAD)"
          echo "new_sha=$new_sha" >> "$GITHUB_OUTPUT"
          echo "next_cycle=$next_cycle" >> "$GITHUB_OUTPUT"

      - name: Dispatch review for the new commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.context.outputs.pr_number }}
          NEW_SHA: ${{ steps.push.outputs.new_sha }}
          NEXT_CYCLE: ${{ steps.push.outputs.next_cycle }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run automated-review.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "pr_number=$PR_NUMBER" \
            -f "expected_head_sha=$NEW_SHA" \
            -f "cycle=$NEXT_CYCLE"
